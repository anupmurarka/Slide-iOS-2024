# TestFlight beta upload. Manual only — this used to trigger on `beta-*` tags, which
# would burn macOS runner minutes on every tag push.
#
# Requires repository secrets that this fork does not currently set:
#   MATCH_DEPLOY_PRIVATE_KEY — SSH key with read access to the fastlane match repo
#   MATCH_PASSWORD           — passphrase for the match keychain
# Without them the "fastlane beta" step will fail at code signing.
name: TestFlight beta (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache RubyGems
        uses: actions/cache@v4
        id: cache-bundles
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gem-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gem-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Ruby dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4

      - name: Install SwiftLint
        run: brew install swiftlint

      # https://github.com/hashicorp/terraform-github-actions/issues/39
      - name: Set up SSH for fastlane match
        env:
          PRIVATE_KEY: ${{ secrets.MATCH_DEPLOY_PRIVATE_KEY }}
        run: |
          git config --global --add url."git@github.com:".insteadOf "https://github.com/"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          SSH_PATH="$HOME/.ssh"
          mkdir -p "$SSH_PATH"
          touch "$SSH_PATH/known_hosts"
          echo "$PRIVATE_KEY" > "$SSH_PATH/id_rsa"
          chmod 700 "$SSH_PATH"
          ssh-keyscan github.com >> "$SSH_PATH/known_hosts"
          chmod 600 "$SSH_PATH/known_hosts"
          chmod 600 "$SSH_PATH/id_rsa"
          eval "$(ssh-agent)"
          ssh-add "$SSH_PATH/id_rsa"

      - name: Upload beta to TestFlight
        run: bundle exec fastlane beta --verbose
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
