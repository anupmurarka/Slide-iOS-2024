# Unit tests. Manual only: macOS runner minutes are not free for this repo's owner by
# choice, so this never fires on push or pull_request. Run it from the Actions tab
# ("Run workflow") when you actually want a clean-machine test pass.
name: Tests (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache RubyGems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gem-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gem-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Ruby dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4

      # The Xcode project runs SwiftLint as a build phase; without it every build logs a
      # "SwiftLint not installed" warning. Version is pinned to match .swiftlint.yml.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run tests
        run: bundle exec fastlane scan
